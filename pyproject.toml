[project]
name = "scholarloop"
version = "0.0.1"
description = "An interactive research loop in which a harness of deterministic checks, not the model, decides what a paper may claim."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Renee Jia", email = "reneejia368@gmail.com" }]
keywords = ["autonomous-research", "agents", "llm", "machine-learning", "experiment-loop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
llm = ["anthropic>=0.109"]                      # only needed for real runs (AnthropicLLM); tests use MockLLM
engines = ["torch>=2.0", "numpy>=1.23", "scikit-learn>=1.1"]  # the real torch experiment engines
nlp = ["datasets>=2.14"]                         # one-time AG News download for the agnews-bow engine

[project.scripts]
scholarloop = "scholarloop.replay:main"   # replay, trace and check a recorded run; needs no model key
scholarloop-ui = "scholarloop.ui.__main__:main"

[project.urls]
Repository = "https://github.com/renee-jia/scholar-loop"

[tool.setuptools.packages.find]
include = ["scholarloop*"]

[tool.setuptools.package-data]
"scholarloop.writing" = ["skills/*.md"]
"scholarloop.core" = ["profile.schema.yaml"]
"scholarloop" = ["samples/*/*"]
"scholarloop.ui" = ["static/*.html", "static/*.css", "static/*.js", "static/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]   # tests import `engines.*` and `tests.*` from the repo root; bare `pytest` does not add cwd
