# Real torch engine profile (sklearn digits + MLP). Validate:
#   python -m scholarloop.core.profile validate profiles/digits-mlp.yaml
name: digits-mlp
paradigm: supervised
train_entrypoint: engines/torch_vision/train.py
fixed_module: engines/torch_vision/prepare.py

metric:
  name: val_top1_err          # lower is better
  direction: minimize

budget:
  smoke_sec: 60               # one real torch run is ~1-2s on CPU; generous headroom
  verify_sec: 180
  full_sec: 600

datasets:
  - sklearn-digits

baselines:
  # Must-beat val error (%) = sklearn LogisticRegression on the same frozen folds (5-fold CV mean
  # 3.8, std 0.8; 3.9 on the held-out test). The profile's default MLP knobs get ~4.6 and a wide,
  # long-trained config ~3.5, so beating a linear model takes a real recipe. Smoke screens with
  # slack (Orchestrator smoke_slack), so a borderline idea still earns a multi-seed verify.
  - logreg@3.8

# The loop selects on val every round, so the best val number is optimistically biased. The frozen
# scorer also holds out a test split; full-tier runs are scored on it once, and only the paper sees it.
holdout: true
# 1797 images: one val fold is 288 of them, so a single split moves ~1 point between folds. Seed s
# validates on fold s % 5; the full tier's five seeds are a 5-fold CV estimate.
cv_folds: 5

knobs:                        # tunable hyperparameters (name → default) the agent sets in `config`
  lr: 0.05
  hidden: 128
  depth: 1
  weight_decay: 0.0001
  epochs: 120                  # smoke is ~1-2s here, so under-training is the trap, not the budget:
                              # an MLP needs ~120 epochs to converge (it hits ~4% then, ~8% at 40)

allowed_edits:
  - architecture
  - optimizer
  - schedule
  - regularization

forbidden_edits:
  - "**/prepare.py"
  - prepare.py

debate_roles: [Innovator, Pragmatist, Contrarian]
