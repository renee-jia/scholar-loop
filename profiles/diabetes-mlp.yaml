# Second real domain — torch MLP regression on sklearn diabetes (a different metric: RMSE).
#   python -m scholarloop.core.profile validate profiles/diabetes-mlp.yaml
name: diabetes-mlp
paradigm: supervised
train_entrypoint: engines/torch_regression/train.py
fixed_module: engines/torch_regression/prepare.py

metric:
  name: val_rmse              # root mean squared error — lower is better
  direction: minimize

budget:
  smoke_sec: 60
  verify_sec: 180
  full_sec: 600

datasets:
  - sklearn-diabetes

baselines:
  # Must-beat val RMSE = OLS on the same frozen folds (5-fold CV mean 53.9, per fold 51.8-57.4;
  # 58.7 on the held-out test). The bundled MLP lands on it (~53.7-54.0 across configs), so beating
  # it takes a real improvement: an honest, negative-leaning domain that exercises truthful
  # reporting rather than a loose bar everything clears.
  - linear@53.9

allowed_edits:
  - architecture
  - optimizer
  - schedule
  - regularization

forbidden_edits:
  - "**/prepare.py"
  - prepare.py

# The loop selects on val every round, so the best val number is optimistically biased. The frozen
# scorer also holds out a test split; full-tier runs are scored on it once, and only the paper sees it.
holdout: true
# 442 samples: one val fold is ~70 points, and OLS alone moves 5.6 RMSE between folds. Seed s
# validates on fold s % 5, so the full tier's five seeds are a 5-fold CV estimate.
cv_folds: 5

knobs:                        # tunable hyperparameters (name → default) the agent sets in `config`
  lr: 0.1
  hidden: 32
  depth: 1
  weight_decay: 0.0001
  epochs: 200

debate_roles: [Innovator, Pragmatist, Contrarian]
